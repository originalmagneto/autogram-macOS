# Builds, Developer-ID signs, notarizes, and publishes Chevron7 together with
# a Sparkle appcast. No signing material is committed to the repository.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (empty: derive it from the commits)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          [[ -n "$version" ]] || version="$(Chevron7/scripts/next-version.sh)"
          if [[ -z "$version" ]]; then
            echo "No feat, fix or perf commit since the last release: nothing to publish."
          elif git rev-parse -q --verify "refs/tags/native-v$version" >/dev/null; then
            echo "native-v$version already exists: nothing to publish."
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release credentials
        if: steps.version.outputs.version != ''
        env:
          P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PRIVATE: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          for name in P12 P12_PASSWORD API_KEY API_KEY_ID API_ISSUER SPARKLE_PRIVATE SPARKLE_PUBLIC; do
            [[ -n "${!name}" ]] || { echo "Missing release configuration: $name" >&2; exit 1; }
          done

      - name: Import Developer ID and notarization credentials
        if: steps.version.outputs.version != ''
        env:
          P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/chevron7-signing.keychain-db"
          password="chevron7-actions"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"

          printf '%s' "$P12" | /usr/bin/base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "Developer ID Application identity not found" >&2; exit 1; }

          printf '%s' "$API_KEY" | /usr/bin/base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_FILE=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER_ID=${{ secrets.APPLE_API_ISSUER_ID }}" >> "$GITHUB_ENV"

      - name: Set up Azul Zulu FX 25
        if: steps.version.outputs.version != ''
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          java-package: jdk+fx
          architecture: aarch64
          cache: maven
          cache-dependency-path: engine/pom.xml

      - name: Build the signing engine
        if: steps.version.outputs.version != ''
        run: AUTOGRAM_JAVA_HOME="$JAVA_HOME" Chevron7/scripts/build-engine.sh

      - name: Build Chevron7.app
        if: steps.version.outputs.version != ''
        working-directory: Chevron7
        env:
          CHEVRON7_VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          xcodebuild -version
          swift --version
          ./build_app.sh --release package

      - name: Developer ID sign Chevron7.app
        if: steps.version.outputs.version != ''
        working-directory: Chevron7
        run: |
          app="$(swift build -c release --show-bin-path)/Chevron7.app"
          bash scripts/sign-release.sh "$app"

      - name: Notarize and staple Chevron7.app
        if: steps.version.outputs.version != ''
        working-directory: Chevron7
        run: |
          app="$(swift build -c release --show-bin-path)/Chevron7.app"
          bash scripts/notarize-release.sh "$app"

      - name: Package the DMG
        if: steps.version.outputs.version != ''
        run: Chevron7/scripts/package-release.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/dist"

      - name: Sign, notarize, and staple the DMG
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="$RUNNER_TEMP/dist/Chevron7-v$VERSION.dmg"
          codesign --force --timestamp --sign "$CODE_SIGN_IDENTITY" "$dmg"
          bash Chevron7/scripts/notarize-release.sh "$dmg"
          (cd "$RUNNER_TEMP/dist" && shasum -a 256 "Chevron7-v$VERSION.dmg" > SHA256SUMS.txt)

      - name: Generate signed Sparkle appcast
        if: steps.version.outputs.version != ''
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: bash Chevron7/scripts/generate-appcast.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/dist"

      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Chevron7/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "native-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Chevron7 v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/dist/Chevron7-v$VERSION.dmg" \
            "$RUNNER_TEMP/dist/SHA256SUMS.txt" \
            "$RUNNER_TEMP/dist/appcast.xml"

      - name: Remove release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/chevron7-signing.keychain-db" 2>/dev/null || true
