name: Native macOS Unsigned Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Liberica JDK 25 with JavaFX
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: liberica
          java-version: '25'
          java-package: jdk+fx
          architecture: aarch64

      - name: Confirm Apple silicon toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "${RUNNER_ARCH}" = ARM64
          file "${JAVA_HOME}/bin/java" | grep -q arm64
          java -version
          xcodebuild -version

      - name: Build unsigned native app
        shell: bash
        run: scripts/native-macos/build-native-app.sh

      - name: Package unsigned DMG
        shell: bash
        run: |
          set -euo pipefail
          scripts/native-macos/package-native-dmg.sh
          version="${GITHUB_REF_NAME#native-v}"
          mv build/native/Autogram-native-preview.dmg "build/native/Autogram-macOS-${version}-unsigned.dmg"
          shasum -a 256 "build/native/Autogram-macOS-${version}-unsigned.dmg" >"build/native/Autogram-macOS-${version}-unsigned.dmg.sha256"
          rm -f build/native/Autogram-native-preview.dmg.sha256
          echo "RELEASE_DMG=build/native/Autogram-macOS-${version}-unsigned.dmg" >>"${GITHUB_ENV}"

      - name: Verify unsigned DMG
        shell: bash
        run: scripts/native-macos/verify-native-release.sh "${RELEASE_DMG}"

      - name: Write release introduction
        shell: bash
        run: |
          cat >"${RUNNER_TEMP}/release-intro.md" <<'EOF'
          > [!WARNING]
          > This beta is unsigned and not notarized because the project does not yet use a paid Apple Developer account. macOS may block the first launch.

          > [!IMPORTANT]
          > eID card support is not implemented yet. This beta currently supports signing with I.CA SecureStore.

          ## Installation

          1. Download the DMG and drag **Autogram macOS** to **Applications**.
          2. In Applications, Control-click **Autogram macOS** and choose **Open**.
          3. Confirm **Open** when macOS displays the security warning.

          The release is Apple silicon only and requires macOS 27 or later. Verify the download with the attached SHA-256 checksum.

          ## Changes
          EOF

      - name: Publish unsigned GitHub release
        if: startsWith(github.ref, 'refs/tags/native-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_DMG}" "${RELEASE_DMG}.sha256" \
            --title "Autogram macOS 0.1.1 Beta" \
            --notes "$(cat "${RUNNER_TEMP}/release-intro.md")" \
            --generate-notes \
            --latest
