name: Native macOS Preview

on:
  pull_request:
    paths:
      - '.github/workflows/native-macos-preview.yml'
      - 'native-macos/**'
      - 'scripts/native-macos/**'
      - 'src/main/**'
      - 'src/test/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
  push:
    paths:
      - '.github/workflows/native-macos-preview.yml'
      - 'native-macos/**'
      - 'scripts/native-macos/**'
      - 'src/main/**'
      - 'src/test/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'

permissions:
  contents: read

jobs:
  build:
    # GitHub runner-images issue 14404: macOS 26, Xcode 27 beta by default, macOS 27 SDK.
    runs-on: xcode-27

    steps:
      - name: Check out source
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Liberica JDK 25 with JavaFX
        # actions/setup-java@v4
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: liberica
          java-version: '25'
          java-package: jdk+fx
          architecture: aarch64

      - name: Confirm ARM64 runner, JDK, and default Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "${RUNNER_ARCH}" = ARM64
          file "${JAVA_HOME}/bin/java" | grep -q 'arm64'
          java -version
          xcodebuild -version

      - name: Run existing Java tests
        shell: bash
        run: ./mvnw -B -C test -Psystem-jdk

      - name: Run native non-UI tests
        shell: bash
        run: |
          xcodebuild test \
            -project native-macos/Autogram.xcodeproj \
            -scheme Autogram \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:AutogramTests \
            -only-testing:AutogramIntegrationTests

      - name: Build unsigned native app
        shell: bash
        run: scripts/native-macos/build-native-app.sh

      - name: Package preview DMG
        shell: bash
        run: scripts/native-macos/package-native-dmg.sh

      - name: Verify preview structure
        shell: bash
        run: scripts/native-macos/verify-native-release.sh

      - name: Upload unsigned preview DMG and checksum
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autogram-native-macos-preview
          path: |
            build/native/Autogram-native-preview.dmg
            build/native/Autogram-native-preview.dmg.sha256
          if-no-files-found: error
