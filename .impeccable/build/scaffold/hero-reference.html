<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-3-lock.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0a0b1a}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <figure class="r-nav-icon region plate" data-region="nav-icon"><img src="../../../website/public/plates/nav-icon.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-nav-wordmark region text" data-region="nav-wordmark"><!-- wordmark Chevron7 in white grotesque --><p style="font-size:var(--r-nav-wordmark-font);line-height:1.05;margin:0">nav-wordmark</p></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- nav links Podpisovanie, Statne weby, Mobilom, Zarucena konverzia in light grey --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-lang region text" data-region="nav-lang"><!-- language switch SK / EN --><p style="font-size:var(--r-nav-lang-font);line-height:1.05;margin:0">nav-lang</p></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- white pill button Stiahnut: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline region text" data-region="headline"><!-- two-line white bold headline Kvalifikovany podpis. Nativne na Macu. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subline region text" data-region="subline"><!-- two-line light grey subline about signing PDF with eID, I.CA or iPhone --><p style="font-size:var(--r-subline-font);line-height:1.05;margin:0">subline</p></div>
  <div class="r-cta-download region control" data-region="cta-download"><!-- white pill primary button Stiahnut pre macOS: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-download); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-cta-github region control" data-region="cta-github"><!-- outlined pill button with GitHub mark Zdrojovy kod na GitHube: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-github); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-spec-line region text" data-region="spec-line"><!-- small grey spec line macOS 27, Apple Silicon, zadarmo, EUPL-1.2 --><p style="font-size:var(--r-spec-line-font);line-height:1.05;margin:0">spec-line</p></div>
  <figure class="r-app-window region plate" data-region="app-window"><img src="../../../website/public/plates/app-window.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-pips region chrome" data-region="pips"><!-- row of seven small chevron marks, six grey, the seventh amber --></div>
  <div class="r-pips-caption region text" data-region="pips-caption"><!-- small grey caption Siedma krokva zamknuta. Dokument podpisany. --><p style="font-size:var(--r-pips-caption-font);line-height:1.05;margin:0">pips-caption</p></div>
  <div class="r-divider region chrome" data-region="divider"><!-- hairline separating the hero from the next section --></div>
  <div class="r-kartou-rule region chrome" data-region="kartou-rule"><!-- short grey rule above the column title --></div>
  <div class="r-kartou-title region text" data-region="kartou-title"><!-- column title Kartou in white bold --><p style="font-size:var(--r-kartou-title-font);line-height:1.05;margin:0">kartou-title</p></div>
  <div class="r-kartou-sub region text" data-region="kartou-sub"><!-- column subline in grey --><p style="font-size:var(--r-kartou-sub-font);line-height:1.05;margin:0">kartou-sub</p></div>
  <div class="r-mobilom-rule region chrome" data-region="mobilom-rule"><!-- short grey rule above the column title --></div>
  <div class="r-mobilom-title region text" data-region="mobilom-title"><!-- column title Mobilom in white bold --><p style="font-size:var(--r-mobilom-title-font);line-height:1.05;margin:0">mobilom-title</p></div>
  <div class="r-mobilom-sub region text" data-region="mobilom-sub"><!-- column subline in grey --><p style="font-size:var(--r-mobilom-sub-font);line-height:1.05;margin:0">mobilom-sub</p></div>
  <div class="r-safari-rule region chrome" data-region="safari-rule"><!-- short grey rule above the column title --></div>
  <div class="r-safari-title region text" data-region="safari-title"><!-- column title V Safari in white bold --><p style="font-size:var(--r-safari-title-font);line-height:1.05;margin:0">safari-title</p></div>
  <div class="r-safari-sub region text" data-region="safari-sub"><!-- column subline in grey --><p style="font-size:var(--r-safari-sub-font);line-height:1.05;margin:0">safari-sub</p></div>
  <figure class="r-icon-light region plate" data-region="icon-light"><img src="../../../website/public/plates/icon-light.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
</main>
</body>
</html>
