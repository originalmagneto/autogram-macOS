  <rect x="784" y="412" width="328" height="180" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="800" y="434" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.4" fill="#7a8399">INFRAŠTRUKTÚRA</text>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">
    <rect x="800" y="444" width="296" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="948" y="458" text-anchor="middle">EZZKServicing — Mock | HTTPS</text>
    <text x="948" y="472" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">evidenčné číslo · serverový čas · zápis</text>
    <rect x="800" y="492" width="296" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="948" y="506" text-anchor="middle">QualifiedSigningProviding</text>
    <text x="948" y="520" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">Keychain identities · mandát · demo ASiC-E</text>
    <rect x="800" y="540" width="296" height="36" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="948" y="554" text-anchor="middle">LocalEvidenceStore · KeychainStore</text>
    <text x="948" y="568" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">register JSON · CSV export · tajomstvá</text>
  </g>

  <!-- store -> kit connector -->
  <line x1="580" y1="332" x2="588" y2="372" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-acc)"/>

  <!-- legend -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#7a8399">
    <rect x="32" y="616" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="52" y="626">focal</text>
    <rect x="112" y="616" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="132" y="626">komponent</text>
    <rect x="216" y="616" width="12" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="236" y="626">služba / protokol</text>
    <line x1="330" y1="622" x2="358" y2="622" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr)"/>
    <text x="366" y="626">závislosť</text>
  </g>
</svg>
