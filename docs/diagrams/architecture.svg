  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2d3142">
    <rect x="424" y="444" width="160 " height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="504" y="462" text-anchor="middle">PDFAConverter</text>
    <text x="504" y="478" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#4f5d75">XMP pdfaid · OutputIntent</text>
    <rect x="592" y="444" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="672" y="462" text-anchor="middle">ClauseGenerator</text>
    <text x="672" y="478" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">XML schéma · SHA-256</text>
    <rect x="424" y="500" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="504" y="518" text-anchor="middle">EmbeddedFileService</text>
    <text x="504" y="534" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">XML → PDF príloha</text>
    <rect x="592" y="500" width="160" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="672" y="518" text-anchor="middle">ClausePDFRenderer</text>
    <text x="672" y="534" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">tlač doložky (CoreText)</text>
    <rect x="424" y="556" width="328" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
    <text x="588" y="570" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#4f5d75">ASiCEPackager · ZIP store + CRC32</text>
  </g>

