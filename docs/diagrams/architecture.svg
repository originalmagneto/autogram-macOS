<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Autogram macOS — architektúra</title>
  <desc id="arch-desc">Vrstvená architektúra: SwiftUI aplikácia, session store a testovateľná knižnica AutogramKit s enginmi, dokumentovými službami a infraštruktúrou.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="640" fill="#f5f5f5"/>

  <text x="32" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2d3142">Autogram macOS — vrstvená architektúra</text>
  <text x="32" y="76" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#7a8399">SWIFTUI · @OBSERVABLE · ZERO DEPENDENCIES · MACOS 14+</text>

  <!-- Layer 1: App -->
  <rect x="32" y="104" width="1096" height="140" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="128" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.8" fill="#7a8399">AUTOGramAPP — SWIFTUI VRSTVA</text>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">
    <rect x="48" y="144" width="120" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="108" y="168" text-anchor="middle">RootView</text>
    <rect x="184" y="144" width="132" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="250" y="162" text-anchor="middle">ZakoFlowView</text>
    <text x="250" y="177" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="400" fill="#7a8399">5-krokový stepper</text>
    <rect x="332" y="144" width="150" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="407" y="162" text-anchor="middle">AnalysisCanvas</text>
    <text x="407" y="177" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="400" fill="#7a8399">PDF + bounding boxy</text>
    <rect x="498" y="144" width="146" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="571" y="162" text-anchor="middle">AttestationForm</text>
    <text x="571" y="177" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="400" fill="#7a8399">live validácia</text>
    <rect x="660" y="144" width="136" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="728" y="162" text-anchor="middle">AuthorizeView</text>
    <text x="728" y="177" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="400" fill="#7a8399">gates · KEP · QTS</text>
    <rect x="812" y="144" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="882" y="162" text-anchor="middle">EvidenceDashboard</text>
    <rect x="968" y="144" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="1040" y="162" text-anchor="middle">SettingsView</text>
    <text x="1040" y="177" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="400" fill="#7a8399">AI · PDF/A · EZZK</text>
  </g>

  <!-- Focal store -->
  <rect x="352" y="276" width="456" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="580" y="300" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">@Observable ZakoSessionStore</text>
  <text x="580" y="318" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#4f5d75">stav konverzie · analýza · prvky · doložka · výsledok</text>

  <!-- connectors views -> store -->
  <line x1="250" y1="244" x2="420" y2="276" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="407" y1="244" x2="480" y2="276" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="571" y1="244" x2="580" y2="276" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="728" y1="244" x2="690" y2="276" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="882" y1="244" x2="720" y2="276" stroke="#4f5d75" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Layer 3: Kit -->
  <rect x="32" y="372" width="1096" height="236" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="396" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.8" fill="#7a8399">AUTOGRAMKIT — LOGIKA (UNIT-TESTOVANÁ)</text>

