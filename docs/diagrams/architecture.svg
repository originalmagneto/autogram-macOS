    <text x="140" y="466" text-anchor="middle">PDFAnalysisEngine</text>
    <rect x="224" y="444" width="152" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="300" y="458" text-anchor="middle">DetectionPipeline</text>
    <text x="300" y="472" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">CV + LLM providery</text>
    <rect x="64" y="492" width="152" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="140" y="506" text-anchor="middle">BuiltInVision</text>
    <text x="140" y="520" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">pečiatky · podpisy</text>
    <rect x="224" y="492" width="152" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="300" y="506" text-anchor="middle">Ollama / OpenAI</text>
    <text x="300" y="520" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">voliteľný LLM vision</text>
    <rect x="64" y="540" width="312" height="36" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="220" y="554" text-anchor="middle">PaperClassifier · SheetCounter · TitleSuggest</text>
    <text x="220" y="568" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">A4/A3/Letter · duplex · OCR titul</text>
  </g>

