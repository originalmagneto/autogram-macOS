<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="448" viewBox="0 0 1040 448" role="img" aria-labelledby="finder-quick-action-title finder-quick-action-desc">
  <title id="finder-quick-action-title">Finder Quick Action - podpis PDF s QES a QTS</title>
  <desc id="finder-quick-action-desc">Označené PDF súbory vo Finderi prejdú cez Quick Action, preflight a signing engine, ktorý vytvorí QES, časovú pečiatku a bezpečne pomenovaný výstup.</desc>

  <rect width="1040" height="448" fill="#f5f5f5"/>

  <!-- ======================= ZONES (before arrows and nodes) ======================= -->
  <rect x="32" y="120" width="192" height="140" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="48" y="124" width="124" height="14" rx="2" fill="#f5f5f5"/>
  <text x="110" y="134" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="1.1">FINDER · VSTUP</text>

  <rect x="272" y="88" width="448" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="288" y="92" width="196" height="14" rx="2" fill="#f5f5f5"/>
  <text x="386" y="102" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="1.1">AUTOGRAM MACOS · APPKA</text>

  <rect x="776" y="120" width="232" height="140" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="792" y="124" width="76" height="14" rx="2" fill="#f5f5f5"/>
  <text x="830" y="134" fill="rgba(45,49,66,0.40)" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="1.1">VÝSTUP</text>

  <!-- ======================= ARROWS (before nodes) ======================= -->
  <!-- 1. Finder selection -> Quick Action -->
  <line x1="192" y1="196" x2="296" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fqa-arrow)"/>
  <!-- 2. Quick Action -> Signing Engine -->
  <line x1="464" y1="196" x2="520" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fqa-arrow)"/>
  <!-- 3. Signing Engine -> Signed PDFs (headline outcome, accent) -->
  <line x1="688" y1="196" x2="792" y2="196" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fqa-arrow-accent)"/>
  <!-- 4. Quick Action -> Card and BOK (vertical) -->
  <line x1="384" y1="232" x2="384" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fqa-arrow)"/>
  <!-- 5. Signing Engine -> Qualified TSA (external HTTP, link blue) -->
  <line x1="608" y1="232" x2="608" y2="264" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#fqa-arrow-link)"/>

  <!-- ======================= ARROW LABELS (masks with 6-10px gap) ======================= -->
  <rect x="216" y="176" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="248" y="185" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">VÝBER PDF</text>

  <rect x="476" y="176" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="492" y="185" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">SIGN</text>

  <rect x="708" y="176" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="740" y="185" fill="#eb6c36" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">QES + QTS</text>

  <rect x="392" y="240" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="396" y="249" fill="#7a8399" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.5">PIN / BOK</text>

  <rect x="616" y="240" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="620" y="249" fill="#2e5aa8" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.5">RFC 3161</text>

  <!-- ======================= NODES ======================= -->
  <!-- A: Finder selection (input) -->
  <rect x="64" y="160" width="128" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="160" width="128" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="128" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Finder výber</text>
  <text x="128" y="210" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">PDF · priečinky</text>

  <!-- B1: Quick Action (focal) -->
  <rect x="304" y="160" width="160" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="160" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="384" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Quick Action</text>
  <text x="384" y="210" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">NSServices · dávka</text>

  <!-- B2: Signing Engine (backend) -->
  <rect x="528" y="160" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="608" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Signing Engine</text>
  <text x="608" y="210" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">PAdES · ASiC-E</text>

  <!-- B3: Card and BOK (external) -->
  <rect x="304" y="272" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="304" y="272" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="384" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Karta a BOK</text>
  <text x="384" y="312" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">eID · SAK · CTK</text>

  <!-- B4: Qualified TSA (external) -->
  <rect x="528" y="272" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="528" y="272" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="608" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Kvalifikovaná TSA</text>
  <text x="608" y="312" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Disig · BOSA</text>

  <!-- C: Signed PDFs (store) -->
  <rect x="800" y="160" width="184" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="800" y="160" width="184" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="892" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Podpísané PDF</text>
  <text x="892" y="210" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">výstupný priečinok</text>

  <!-- ======================= LEGEND (horizontal bottom strip) ======================= -->
  <line x1="40" y1="384" x2="1000" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="408" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="1.1">LEGEND</text>

  <rect x="120" y="396" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="140" y="406" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Quick Action (focal)</text>

  <rect x="320" y="396" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="340" y="406" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Krok enginu</text>

  <rect x="480" y="396" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="500" y="406" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Externý / HW</text>

  <rect x="660" y="396" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="680" y="406" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Výstup</text>

  <line x1="800" y1="402" x2="828" y2="402" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="836" y="406" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Hlavný tok</text>

  <defs>
    <marker id="fqa-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="fqa-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="fqa-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
</svg>
