  <text x="32" y="72" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#7a8399">236 TESTOV · 3 SKIPPED · 0 FAIL · macOS 27 · EXTERNÉ KONTRAKTY ZOSTÁVAJÚ OTVORENÉ</text>

  <path d="M944,100 V108 Q944,116 936,116 H192 Q184,116 184,124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#roadmap-open-work-arrow)"/>
