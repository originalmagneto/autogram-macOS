<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="roadmap-open-work-title roadmap-open-work-desc">
  <title id="roadmap-open-work-title">Otvorená roadmapa Autogramu</title>
  <desc id="roadmap-open-work-desc">Tri skupiny otvorenej práce: runtime verifikácia, UX follow-up a interoperabilita s údržbou a release.</desc>
  <defs>
    <marker id="roadmap-open-work-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="roadmap-open-work-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
