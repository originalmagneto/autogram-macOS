    <rect x="824" y="240" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="840" y="264" fill="#eb6c36" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600">08</text>
