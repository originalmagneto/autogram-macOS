<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="976" viewBox="0 0 1040 976" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">AI Vision: detekcia, kontrola a tréningové dáta</title>
  <desc id="ai-desc">Vstavaná detekcia pripraví z PDF kandidátov, klasifikuje ich lokálne a odovzdá človeku na kontrolu; platné výrezy slúžia na porovnávanie a kompletne skontrolované strany na samostatný tréningový export.</desc>
  <defs>
    <marker id="ai-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker>
    <marker id="ai-feedback" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1040" height="976" fill="#f5f5f5"/>
  <text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2d3142">AI Vision: od skenu k overenému nálezu</text>
  <text x="40" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4f5d75">Vstavaný tok beží na Macu. Externý vision model je voliteľný v nastaveniach.</text>
  <!-- Connectors stay in the gutters, outside every text block. -->
  <g fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#ai-arrow)">
    <path d="M480 216 H552"/>
    <path d="M780 304 V372"/>
    <path d="M560 480 H488"/>
    <path d="M260 604 V688"/>
    <path d="M480 560 H512 A8 8 0 0 1 520 568 V632 A8 8 0 0 0 528 640 H772 A8 8 0 0 1 780 648 V688"/>
  </g>
  <path d="M40 776 H28 A8 8 0 0 1 20 768 V352 A8 8 0 0 1 28 344 H592 A8 8 0 0 1 600 352 V372" fill="none" stroke="#2e5aa8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ai-feedback)"/>
  <text x="280" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2e5aa8">ĎALŠÍ SKEN</text>
  <text x="626" y="626" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4f5d75">CELÁ STRANA</text>

  <g id="ai-page" font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="128" width="440" height="176" rx="8" fill="#ffffff" stroke="#b5bdc9"/>
    <text x="64" y="156" font-size="12" letter-spacing="1" fill="#4f5d75">01 · VSTUP</text>
    <text x="64" y="184" font-size="21" font-weight="600" fill="#2d3142">Analýza strany</text>
    <text x="64" y="214" font-size="16" fill="#4f5d75">Jedno vykreslenie PDF strany.</text>
    <text x="64" y="238" font-size="16" fill="#4f5d75">Rýchle aj presné OCR + čiarové kódy.</text>
    <text x="64" y="262" font-size="16" fill="#4f5d75">Podklady na vylúčenie tlačeného textu.</text>
  </g>
  <g id="ai-candidates" font-family="Arial, Helvetica, sans-serif">
    <rect x="560" y="128" width="440" height="176" rx="8" fill="#ffffff" stroke="#b5bdc9"/>
    <text x="584" y="156" font-size="12" letter-spacing="1" fill="#4f5d75">02 · OBLASTI</text>
    <text x="584" y="184" font-size="21" font-weight="600" fill="#2d3142">Návrhy kandidátov</text>
    <text x="584" y="214" font-size="16" fill="#4f5d75">Heuristiky · kontúry · saliency.</text>
    <text x="584" y="238" font-size="16" fill="#4f5d75">Zlúčenie prekrývajúcich sa oblastí.</text>
    <text x="584" y="262" font-size="16" fill="#4f5d75">Filtre textu a formulárových čiar.</text>
  </g>
  <g id="ai-classifier" font-family="Arial, Helvetica, sans-serif">
    <rect x="560" y="380" width="440" height="224" rx="8" fill="#ffffff" stroke="#b5bdc9"/>
    <text x="584" y="408" font-size="12" letter-spacing="1" fill="#4f5d75">03 · KLASIFIKÁCIA</text>
    <text x="584" y="436" font-size="21" font-weight="600" fill="#2d3142">Lokálne posúdenie výrezu</text>
    <text x="584" y="466" font-size="16" fill="#4f5d75">kNN porovnáva uložené príklady.</text>
    <text x="584" y="490" font-size="16" fill="#4f5d75">Pri neistote: on-device Apple model.</text>
    <text x="584" y="514" font-size="16" fill="#4f5d75">Najviac 12 výrezov na stranu, limit 8 s.</text>
    <text x="584" y="538" font-size="16" fill="#4f5d75">Výsledok je návrh na ľudskú kontrolu.</text>
    <text x="584" y="562" font-size="16" fill="#4f5d75">Model neposudzuje právnu pravosť.</text>
  </g>
  <g id="ai-review" font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="380" width="440" height="224" rx="8" fill="#fff5ee" stroke="#eb6c36"/>
    <text x="64" y="408" font-size="12" letter-spacing="1" fill="#4f5d75">04 · ROZHODUJE ČLOVEK</text>
    <text x="64" y="436" font-size="21" font-weight="600" fill="#2d3142">Kontrola dokumentu</text>
    <text x="64" y="466" font-size="16" fill="#4f5d75">Potvrdiť, odmietnuť alebo opraviť rámec.</text>
    <text x="64" y="490" font-size="16" fill="#4f5d75">16 druhov + fyzická kontrola originálu.</text>
    <text x="64" y="514" font-size="16" fill="#4f5d75">Skontrolovať každú neprázdnu stranu.</text>
    <text x="64" y="538" font-size="16" fill="#4f5d75">Bez prvkov? Potvrdiť výslovne.</text>
    <text x="64" y="562" font-size="16" fill="#4f5d75">Právne posúdenie zostáva na človeku.</text>
  </g>
  <g id="ai-bank" font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="696" width="440" height="176" rx="8" fill="#eceff3" stroke="#b5bdc9"/>
    <text x="64" y="724" font-size="12" letter-spacing="1" fill="#4f5d75">LOKÁLNE POROVNÁVANIE</text>
    <text x="64" y="752" font-size="21" font-weight="600" fill="#2d3142">Banka výrezov</text>
    <text x="64" y="782" font-size="16" fill="#4f5d75">Platné pozitívne aj zamietnuté výrezy.</text>
    <text x="64" y="806" font-size="16" fill="#4f5d75">Fyzická kontrola nevytvorí obrazový výrez.</text>
    <text x="64" y="830" font-size="16" fill="#4f5d75">Zmena nálezu zneplatní starý príklad.</text>
  </g>
  <g id="ai-export" font-family="Arial, Helvetica, sans-serif">
    <rect x="560" y="696" width="440" height="176" rx="8" fill="#eceff3" stroke="#b5bdc9"/>
    <text x="584" y="724" font-size="12" letter-spacing="1" fill="#4f5d75">SAMOSTATNÝ TRÉNING</text>
    <text x="584" y="752" font-size="21" font-weight="600" fill="#2d3142">Export pre Create ML</text>
    <text x="584" y="782" font-size="16" fill="#4f5d75">Iba kompletne skontrolované strany.</text>
    <text x="584" y="806" font-size="16" fill="#4f5d75">Prvok bez rámca vylúči súvisiace strany.</text>
    <text x="584" y="830" font-size="16" fill="#4f5d75">Rozdelenie dát podľa celých dokumentov.</text>
  </g>
  <line x1="40" y1="904" x2="1000" y2="904" stroke="#b5bdc9"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4f5d75">
    <text x="40" y="932">Banka príkladov priebežne pomáha kNN. Export sám model nenatrénuje.</text>
    <text x="40" y="956">Presnosť nových tried treba zmerať na reálnych skenoch oddelených od tréningových dát.</text>
  </g>
</svg>
