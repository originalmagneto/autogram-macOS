<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">AI Vision pipeline - vrstvená on-device detekcia bezpečnostných prvkov</title>
  <desc id="ai-desc">Strana sa vykreslí raz. Tri zdroje kandidátov (vstavané heuristiky, Vision kontúry, saliency) sa zlúčia, každý výrez klasifikuje kNN nad lokálnym datasetom a v prípade neistoty on-device Apple model. Advokát nálezy potvrdí alebo odmietne a každé rozhodnutie sa vracia do datasetu.</desc>
  <defs>
    <marker id="a-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/>
    </marker>
    <marker id="a-arr-o" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="1160" height="560" fill="#f5f5f5"/>
  <text x="32" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2d3142">AI Vision - od skenu k potvrdenému prvku</text>
  <text x="32" y="72" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#7a8399">LAYEREDDETECTIONPROVIDER · 100 % ON-DEVICE · UČÍ SA Z KAŽDÉHO POTVRDENIA</text>

  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <!-- column labels -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.4" fill="#7a8399">
      <text x="40" y="108">1 · STRANA</text>
      <text x="250" y="108">2 · KANDIDÁTI</text>
      <text x="530" y="108">3 · KLASIFIKÁCIA</text>
      <text x="830" y="108">4 · KONTROLA</text>
    </g>

    <!-- page render -->
    <rect x="40" y="124" width="150" height="196" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="56" y="144" width="118" height="10" rx="2" fill="rgba(45,49,66,0.15)"/>
    <rect x="56" y="162" width="104" height="6" rx="2" fill="rgba(45,49,66,0.10)"/>
    <rect x="56" y="176" width="110" height="6" rx="2" fill="rgba(45,49,66,0.10)"/>
    <rect x="56" y="190" width="92" height="6" rx="2" fill="rgba(45,49,66,0.10)"/>
    <circle cx="146" cy="272" r="22" fill="none" stroke="#2e5aa8" stroke-width="3"/>
    <circle cx="146" cy="272" r="14" fill="none" stroke="#2e5aa8" stroke-width="1.5"/>
    <path d="M60,286 c10,-18 18,10 28,-6 s14,12 26,-4" fill="none" stroke="#2d3142" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="344" font-size="12" fill="#2d3142">PDFKit render 760 px</text>
    <text x="40" y="360" font-size="11" fill="#7a8399">Vision OCR + čiarové kódy = vylúčenia</text>
    <text x="40" y="376" font-size="11" fill="#7a8399">jedno vykreslenie na stranu</text>

    <path d="M196,222 L236,222" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#a-arr)"/>

    <!-- candidate sources -->
    <rect x="240" y="124" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="256" y="148" font-size="13" font-weight="600" fill="#2d3142">Vstavané heuristiky</text>
    <text x="256" y="166" font-size="11" fill="#7a8399">HSV masky, komponenty, tvarové filtre (zmrazené)</text>

    <rect x="240" y="192" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="256" y="216" font-size="13" font-weight="600" fill="#2d3142">Vision kontúry</text>
    <text x="256" y="234" font-size="11" fill="#7a8399">DetectContoursRequest, uzavreté obrysy</text>

    <rect x="240" y="260" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="256" y="284" font-size="13" font-weight="600" fill="#2d3142">Vision saliency</text>
    <text x="256" y="302" font-size="11" fill="#7a8399">objectness, nápadné oblasti mimo textu</text>

    <path d="M480,152 L500,152 L500,222 L516,222" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#a-arr)"/>
    <path d="M480,220 L500,220" fill="none" stroke="#4f5d75" stroke-width="1.5"/>
    <path d="M480,288 L500,288 L500,222" fill="none" stroke="#4f5d75" stroke-width="1.5"/>

    <text x="240" y="344" font-size="12" fill="#2d3142">Zlúčenie podľa IoU</text>
    <text x="240" y="360" font-size="11" fill="#7a8399">veľkostné brány, vylúčenie textu a kódov</text>
    <text x="240" y="376" font-size="11" fill="#7a8399">jeden kandidát = jeden výrez</text>

    <!-- classification -->
    <rect x="520" y="124" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="536" y="148" font-size="13" font-weight="600" fill="#2d3142">kNN nad lokálnym datasetom</text>
    <text x="536" y="166" font-size="11" fill="#7a8399">Vision feature print, 5 najbližších príkladov</text>
    <text x="536" y="182" font-size="11" fill="#7a8399">pozitívne aj zamietnuté výrezy, istý výsledok = hotovo</text>

    <path d="M660,204 L660,230" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#a-arr)"/>
    <text x="668" y="222" font-size="10" fill="#7a8399">neisté</text>

    <rect x="520" y="234" width="280" height="82" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1.5"/>
    <text x="536" y="258" font-size="13" font-weight="600" fill="#2d3142">On-device Apple model</text>
    <text x="536" y="276" font-size="11" fill="#7a8399">Foundation Models, obrázok + štruktúrovaný výstup</text>
    <text x="536" y="292" font-size="11" fill="#7a8399">druh prvku, istota, slovenský opis</text>
    <text x="536" y="308" font-size="11" fill="#7a8399">najviac 12 výrezov na stranu, 8 s limit</text>

    <text x="520" y="344" font-size="12" fill="#2d3142">Bez dostupného modelu</text>
    <text x="520" y="360" font-size="11" fill="#7a8399">nález ostáva s odhadom vstavaných heuristík</text>
    <text x="520" y="376" font-size="11" fill="#7a8399">výsledok nikdy nie je horší ako doteraz</text>

    <path d="M806,222 L836,222" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#a-arr)"/>

    <!-- review -->
    <rect x="840" y="124" width="280" height="192" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="856" y="148" font-size="13" font-weight="600" fill="#2d3142">Advokát potvrdí alebo odmietne</text>
    <text x="856" y="170" font-size="11" fill="#7a8399">každá neprázdna strana musí byť skontrolovaná</text>
    <text x="856" y="186" font-size="11" fill="#7a8399">rámec sa dá posunúť, nakresliť alebo</text>
    <text x="856" y="202" font-size="11" fill="#7a8399">kliknutím prichytiť na prvok (Vision segmentácia)</text>
    <rect x="856" y="220" width="248" height="1" fill="rgba(45,49,66,0.12)"/>
    <text x="856" y="244" font-size="12" font-weight="600" fill="#2d3142">Potvrdený prvok</text>
    <text x="856" y="262" font-size="11" fill="#7a8399">druh, poloha a opis idú do osvedčovacej doložky</text>
    <text x="856" y="286" font-size="12" font-weight="600" fill="#2d3142">Každé rozhodnutie</text>
    <text x="856" y="304" font-size="11" fill="#7a8399">výrez + feature print do lokálneho datasetu</text>

    <!-- learning loop -->
    <path d="M980,320 L980,440 L504,440 L504,164 L516,164" fill="none" stroke="#eb6c36" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-arr-o)"/>
    <rect x="620" y="424" width="240" height="32" rx="16" fill="#ffffff" stroke="#eb6c36" stroke-width="1"/>
    <text x="740" y="445" font-size="11" text-anchor="middle" fill="#eb6c36">dataset rastie s každou konverziou</text>

    <!-- footer -->
    <rect x="40" y="464" width="1080" height="1" fill="rgba(45,49,66,0.12)"/>
    <text x="40" y="492" font-size="11" fill="#2d3142">Dataset: ~/Library/Application Support/Autogram/VisionBank</text>
    <text x="40" y="510" font-size="11" fill="#7a8399">Export pre Create ML (fáza C: vlastný objektový detektor). Nič neopúšťa Mac, pokiaľ v Nastaveniach výslovne nezvolíte externý LLM.</text>
    <text x="40" y="536" font-size="11" fill="#7a8399">Meranie: swift run vision-eval &lt;dataset&gt; vypíše presnosť, úplnosť a čas na stranu, aby každá zmena bola doložená číslami.</text>
  </g>
</svg>
