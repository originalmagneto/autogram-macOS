<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-labelledby="ai-title ai-desc">
  <title id="ai-title">AI Vision pipeline — detekcia bezpečnostných prvkov</title>
  <desc id="ai-desc">Strana PDF sa vykreslí do bitmapy, pixelová klasifikácia vytvorí farebnú a tmavú masku, connected components a filtre rozpoznajú pečiatky a podpisy, voliteľný LLM vrstvu obohatí o ďalšie boxy.</desc>
  <defs>
    <marker id="a-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/>
    </marker>
  </defs>

  <rect width="1160" height="420" fill="#f5f5f5"/>
  <text x="32" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2d3142">AI Vision — od skenu k slovnému opisu</text>
  <text x="32" y="72" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#7a8399">BUILTINVISIONPROVIDER · ON-DEVICE · GDPR SAFE · VOLITEĽNÝ LLM BOOST</text>

  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <!-- page render -->
    <rect x="40" y="120" width="140" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="56" y="140" width="108" height="10" rx="2" fill="rgba(45,49,66,0.15)"/>
    <rect x="56" y="158" width="96" height="6" rx="2" fill="rgba(45,49,66,0.10)"/>
    <rect x="56" y="172" width="102" height="6" rx="2" fill="rgba(45,49,66,0.10)"/>
    <rect x="56" y="186" width="88" height="6" rx="2" fill="rgba(45,49,66,0.10)"/>
    <!-- stamp -->
    <circle cx="146" cy="252" r="22" fill="none" stroke="rgba(46,90,168,0.55)" stroke-width="3"/>
    <!-- signature squiggle -->
    <path d="M60,278 q10,-14 20,0 t20,0 t20,0 t16,-6" fill="none" stroke="rgba(45,49,66,0.75)" stroke-width="2.4" stroke-linecap="round"/>
    <text x="110" y="316" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">render 520 px</text>

    <!-- masks -->
    <rect x="236" y="128" width="164" height="76 " rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="250" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">FAREBNÁ MASKA</text>
    <text x="250" y="166" font-size="11.5" font-weight="600" fill="#2d3142">sat &gt; 0.28</text>
    <text x="250" y="180" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">modro-červený atrament</text>

    <rect x="236" y="220" width="164" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="250" y="242" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">TMAVÁ MASKA</text>
    <text x="250" y="258" font-size="11.5" font-weight="600" fill="#2d3142">V &lt; 0.42</text>
    <text x="250" y="272" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">ceruzka / pero</text>

    <!-- CC + filters -->
    <rect x="456" y="152" width="188" height="120" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="470" y="174" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">CONNECTED COMPONENTS</text>
    <text x="470" y="192" font-size="11" font-weight="600" fill="#2d3142">BFS labeling → stats</text>
    <text x="470" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">area · bbox · perimeter</text>
    <line x1="470" y1="222" x2="630" y2="222" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="470" y="240" font-size="11" font-weight="600" fill="#2d3142">pečiatka: Ø 3.5–30 %</text>
    <text x="470" y="256" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">aspect 0.55–1.7 · radial ≥ 0.45</text>
    <text x="470" y="268" font-size="11" font-weight="600" fill="#2d3142" opacity="0">.</text>

    <!-- results -->
    <rect x="700" y="120" width="196" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="714" y="142" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">ÚRADNÁ PEČIATKA</text>
    <text x="714" y="160" font-size="11.5" font-weight="600" fill="#2d3142">box + confidence</text>
    <text x="714" y="178" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#4f5d75">„strane 2, v pravej dolnej…“</text>

    <rect x="700" y="208" width="196" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="714" y="230" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">VLASTNORUČNÝ PODPIS</text>
    <text x="714" y="248" font-size="11.5" font-weight="600" fill="#2d3142">elongácia &gt; 2.2</text>
    <text x="714" y="266" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#4f5d75">bez dotyku okrajov strany</text>

    <!-- optional LLM -->
    <rect x="952" y="120" width="176" height="100" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="966" y="142" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#2e5aa8" font-weight="600">VOLITEĽNÝ LLM</text>
    <text x="966" y="160" font-size="11.5" font-weight="600" fill="#2d3142">Ollama / OpenAI</text>
    <text x="966" y="176" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">JSON boxy → IoU merge</text>
    <text x="966" y="190" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">offline fallback vždy funguje</text>

    <!-- output strip -->
    <rect x="40" y="330" width="1088" height="52" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="584" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d3142">SecurityElement[] — normalizované bounding boxy · istota · slovný opis SK priamo do osvedčovacej doložky (§ 37)</text>
    <text x="584" y="370" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">advokát len schváli — žiadne manuálne popisovanie každej strany</text>
  </g>

  <g stroke="#4f5d75" stroke-width="1" fill="none">
    <path d="M184,208 H232 V166" marker-end="url(#a-arr)"/>
    <path d="M184,240 H232 V258" marker-end="url(#a-arr)"/>
    <path d="M400,166 H424 V170 H452" marker-end="url(#a-arr)"/>
    <path d="M400,258 H424 V230 H452" marker-end="url(#a-arr)"/>
    <path d="M644,190 H660 V156 H696" marker-end="url(#a-arr)"/>
    <path d="M644,230 H696" marker-end="url(#a-arr)"/>
    <path d="M896,156 H948" marker-end="url(#a-arr)" stroke-dasharray="3,3"/>
    <path d="M1040,224 V326" marker-end="url(#a-arr)"/>
  </g>
</svg>
