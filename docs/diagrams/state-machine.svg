<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380" role="img" aria-labelledby="st-title st-desc">
  <title id="st-title">Stavový automat záznamu o konverzii</title>
  <desc id="st-desc">Stavy: koncept, čaká na evidenčné číslo, pripravené na autorizáciu, autorizované, vo fronte, zapísané v CEZZK; odoslanie môže zlyhať a opakovať sa.</desc>
  <defs>
    <marker id="s-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/>
    </marker>
    <marker id="s-arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="1160" height="380" fill="#f5f5f5"/>
  <text x="32" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2d3142">Životný cyklus záznamu v evidencii</text>
  <text x="32" y="72" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#7a8399">LOCAL EVIDENCE STORE · STATUS EVIDENCERECORD.STATUS</text>

  <!-- start dot -->
  <circle cx="56" cy="180" r="6" fill="#2d3142"/>

  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600">
    <!-- draft -->
    <rect x="88" y="152" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="152" y="176" text-anchor="middle" fill="#2d3142">Koncept</text>
    <text x="152" y="193" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">import skenu</text>

    <!-- awaitingNumber -->
    <rect x="272" y="152" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="352" y="176" text-anchor="middle" fill="#2d3142">Čaká na číslo</text>
    <text x="352" y="193" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">analýza hotová</text>

    <!-- readyToSign -->
    <rect x="488" y="152" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="572" y="176" text-anchor="middle" fill="#2d3142">Pripravené</text>
    <text x="572" y="193" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">číslo pridelené</text>

    <!-- signed focal -->
    <rect x="712" y="146" width="168" height="68" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="796" y="172" text-anchor="middle" fill="#2d3142">Autorizované</text>
    <text x="796" y="189" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#4f5d75">KEP mandát + QTS</text>
    <text x="796" y="203" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#4f5d75">ASiC-E · SHA-256</text>

    <!-- queued -->
    <rect x="512" y="280" width="168" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="596" y="302" text-anchor="middle" fill="#2d3142">Vo fronte odoslania</text>
    <text x="596" y="318" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">deadline ≤ 24 h</text>

    <!-- submitted -->
    <rect x="904" y="280" width="184" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="996" y="302" text-anchor="middle" fill="#2d3142">Zapísané v CEZZK</text>
    <text x="996" y="318" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#7a8399">potvrdené MIRRI</text>

    <!-- failed -->
    <rect x="240" y="280" width="168" height="52" rx="6" fill="#ffffff" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="324" y="302" text-anchor="middle" fill="#2d3142">Odoslanie zlyhalo</text>
    <text x="324" y="318" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="400" fill="#eb6c36">retry s backoffom</text>
  </g>

  <!-- transitions -->
  <g stroke="#4f5d75" stroke-width="1" fill="none">
    <line x1="62" y1="180" x2="84" y2="180" marker-end="url(#s-arr)"/>
    <line x1="216" y1="180" x2="268" y2="180" marker-end="url(#s-arr)"/>
    <line x1="432" y1="180" x2="484" y2="180" marker-end="url(#s-arr)"/>
    <line x1="656" y1="180" x2="708" y2="180" marker-end="url(#s-arr)"/>
    <path d="M880,214 V306 H684" marker-end="url(#s-arr)"/>
    <path d="M680,306 H1092 V332 H1092" />
    <path d="M1092,280 V206 H884" marker-end="url(#s-arr)"/>
  </g>
  <path d="M512,306 H412" stroke="#eb6c36" stroke-width="1" fill="none" marker-end="url(#s-arr-acc)"/>

  <!-- labels -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#4f5d75">
    <text x="222" y="170">analýza</text>
    <text x="438" y="170">evidenčné číslo</text>
    <text x="660" y="170">sign()</text>
    <text x="888" y="248">enqueue</text>
    <text x="1000" y="250">submit OK</text>
    <text x="430" y="296" fill="#eb6c36">chyba</text>
  </g>

  <!-- end dot -->
  <circle cx="1104" cy="356" r="6" fill="none" stroke="#2d3142" stroke-width="1.2"/>
  <path d="M1088,306 V356 H1094" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#s-arr)"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#7a8399">
    <text x="32" y="366">POZNÁMKA: zápis CEZZK zamietne záznam ak čas QTS predchádza času konverzie, alebo evidenčné číslo už bolo použité (§ 9 vyhlášky 70/2021).</text>
  </g>
</svg>
