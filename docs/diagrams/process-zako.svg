<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" role="img" aria-labelledby="proc-title proc-desc">
  <title id="proc-title">Proces zaručenej konverzie P→E</title>
  <desc id="proc-desc">Osemkrokový proces: sken originálu, automatická analýza, detekcia prvkov, evidenčné číslo z EZZK, PDF/A konverzia, doložka, autorizácia KEP a zápis do CEZZK.</desc>
  <defs>
    <marker id="p-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/>
    </marker>
    <marker id="p-arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="1160" height="460" fill="#f5f5f5"/>
  <text x="32" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2d3142">Zaručená konverzia P→E — procesný tok</text>
  <text x="32" y="72" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#7a8399">§ 35–39 ZÁKONA Č. 305/2013 Z. Z. · VYHLÁŠKA MIRRI Č. 70/2021 Z. Z.</text>

  <!-- swimlane: advokát -->
  <line x1="32" y1="120" x2="1128" y2="120" stroke="#bfc0c0" stroke-width="1"/>
  <text x="32" y="112" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.4" fill="#7a8399">ADVOOKÁT</text>
  <!-- swimlane: autogram -->
  <line x1="32" y1="300" x2="1128" y2="300" stroke="#bfc0c0" stroke-width="1"/>
  <text x="32" y="292" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.4" fill="#7a8399">AUTOGRAM — AUTOMATIKA</text>
  <!-- lane: externé systémy -->
  <line x1="32" y1="420" x2="1128" y2="420" stroke="#bfc0c0" stroke-width="1"/>
  <text x="32" y="412" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.4" fill="#7a8399">IS EZZK / CEZZK (MIRRI)</text>

  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <!-- step 1 -->
    <rect x="40" y="132" width="120" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="52" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">01</text>
    <text x="52" y="166" font-size="11.5" font-weight="600" fill="#2d3142">Sken originálu</text>

    <!-- step 2 analysis -->
    <rect x="196" y="316" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="208" y="334" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">02 ANALÝZA</text>
    <text x="208" y="350" font-size="11.5" font-weight="600" fill="#2d3142">Strany · listy · formát</text>
    <text x="208" y="364" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">blank-detekcia · A4/A3</text>

    <!-- step 3 detection -->
    <rect x="384" y="316" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="396" y="334" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">03 AI VISION</text>
    <text x="396" y="350" font-size="11.5" font-weight="600" fill="#2d3142">Pečiatky · podpisy</text>
    <text x="396" y="364" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">boxy · istota · slovný opis</text>

    <!-- step 4 confirm (advokat) -->
    <rect x="196" y="132" width="152" height="44" rx="6" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="0.8"/>
    <text x="208" y="150" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">04</text>
    <text x="208" y="166" font-size="11.5" font-weight="600" fill="#2d3142">Potvrdí údaje</text>
    <text x="384" y="158" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#7a8399">← 1 klik namiesto 30 polí</text>

    <!-- step 5 evidence number + time -->
    <rect x="588" y="316" width="180" height="56" rx="6" fill="#ffffff" stroke="#2e5aa8" stroke-width="1"/>
    <text x="600" y="334" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">05 EZZK</text>
    <text x="600" y="350" font-size="11.5" font-weight="600" fill="#2d3142">Evidenčné číslo + čas</text>
    <text x="600" y="364" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">jednorazové · serverový čas</text>

    <!-- step 6 pdfa + clause -->
    <rect x="804" y="316" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="816" y="334" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">06 PDF/A + DOLOŽKA</text>
    <text x="816" y="350" font-size="11.5" font-weight="600" fill="#2d3142">Konverzia · XML embed</text>
    <text x="816" y="364" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">pdfaid:part=2 · SHA-256</text>

    <!-- step 7 authorize (focal) -->
    <rect x="588" y="126" width="176" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="600" y="144" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">07 AUTORIZÁCIA</text>
    <text x="600" y="160" font-size="11.5" font-weight="600" fill="#2d3142">KEP mandát + QTS</text>
    <text x="600" y="174" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#4f5d75">PIN/BOK · ASiC-E výstup</text>

    <!-- step 8 submit to CEZZK -->
    <rect x="804" y="428" width="176" height="24" rx="4" fill="rgba(45,49,66,0.03)" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="892" y="444" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2e5aa8">CEZZK zápis ≤ 24 h</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#4f5d75" stroke-width="1" fill="none">
    <path d="M160,154 H192" marker-end="url(#p-arr)"/>
    <path d="M272,176 V312" marker-end="url(#p-arr)"/>
    <path d="M348,344 H380" marker-end="url(#p-arr)"/>
    <path d="M468,312 V182 H588" marker-end="url(#p-arr)"/>
    <path d="M552,344 H584" marker-end="url(#p-arr)"/>
    <path d="M768,344 H800" marker-end="url(#p-arr)"/>
    <path d="M892,312 V186 H768" marker-end="url(#p-arr-acc)"/>
  </g>

  <!-- ezzk interactions -->
  <g stroke="#2e5aa8" stroke-width="1" fill="none" stroke-dasharray="3,3">
    <path d="M678,372 V400 H120 V432" marker-end="url(#p-arr)"/>
    <path d="M892,372 V424" marker-end="url(#p-arr)"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#2e5aa8">
    <text x="128" y="408">requestEvidenceNumber() · serverTime()</text>
    <text x="900" y="396">submit(záznam)</text>
  </g>
</svg>
