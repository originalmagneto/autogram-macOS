<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="df-title df-desc">
  <title id="df-title">PDF/A engine - dátove toky</title>
  <desc id="df-desc">Vstupný PDF prechádza vektorovou alebo raster cestou, nasleduje zápis PDF/A metadát, výpočet SHA-256, generovanie XML, vloženie ako asociovaný EmbeddedFile, finálna normalizácia a kontrola artefaktu.</desc>
  <defs>
    <marker id="d-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#4f5d75"/>
    </marker>
    <marker id="d-arr-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="1160" height="440" fill="#f5f5f5"/>
  <text x="32" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2d3142">PDF/A-2b engine - dáta v pohybe</text>
  <text x="32" y="72" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="1.6" fill="#7a8399">PDFAConverter · CLAUSEPDFRENDERER · ATTESTATIONCLAUSEGENERATOR · EMBEDDEDFILESERVICE</text>

  <!-- input -->
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <rect x="40" y="176" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="104" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">vstupný PDF</text>
    <text x="104" y="220" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">sken / dokument</text>

    <!-- mode split -->
    <rect x="224" y="120" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="236" y="142" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">VEKTOROVÝ REŽIM</text>
    <text x="236" y="158" font-size="11.5" font-weight="600" fill="#2d3142">zachováva text</text>
    <text x="236" y="170" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">dataRepresentation()</text>

    <rect x="224" y="240" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="236" y="262" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">RASTER REŽIM</text>
    <text x="236" y="278" font-size="11.5" font-weight="600" fill="#2d3142">200 dpi garancia</text>
    <text x="236" y="290" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">per-page CGContext → merge</text>

    <!-- surgery focal -->
    <rect x="456" y="172" width="216" height="88" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="468" y="194" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">INKREMENTÁLNY ZÁPIS</text>
    <text x="468" y="212" font-size="11.5" font-weight="600" fill="#2d3142">%PDF-1.7 + pdfaid:part=2</text>
    <text x="468" y="228" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#4f5d75">+ XMP Metadata stream</text>
    <text x="468" y="242" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#4f5d75">+ sRGB ICC /OutputIntents GTS_PDFA1</text>

    <!-- delivery normalization -->
    <rect x="456" y="300" width="216" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="468" y="322" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#eb6c36" font-weight="600">DORUČENIE</text>
    <text x="468" y="338" font-size="11.5" font-weight="600" fill="#2d3142">Embed → normalize → validate</text>
    <text x="468" y="350" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">/AF · /AFRelationship /Data</text>

    <!-- fingerprint -->
    <rect x="736" y="112" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="816" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">SHA-256 otlačok</text>
    <text x="816" y="148" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">CryptoKit · 64 hex</text>

    <!-- xml -->
    <rect x="736" y="196" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="816" y="218" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">ConversionRecord.xml</text>
    <text x="816" y="234" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">50349287…P→E sk/1.0</text>
    <text x="816" y="248" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">listy · prvky · číslo EZZK</text>

    <!-- embed -->
    <rect x="952" y="196" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="1040" y="218" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d3142">EmbeddedFile</text>
    <text x="1040" y="234" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">/Names/EmbeddedFiles</text>
    <text x="1040" y="248" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">osvedcovacia-dolozka.xml</text>

    <!-- output -->
    <rect x="952" y="304" width="176" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="1040" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3142">PDF/A-2b + XML príloha</text>
    <text x="1040" y="348" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#4f5d75">→ podpis · PDF + .xml.xdcf</text>
    <text x="1040" y="362" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#4f5d75">→ voliteľné .asice → CEZZK</text>
  </g>

  <!-- arrows -->
  <g stroke="#4f5d75" stroke-width="1" fill="none">
    <path d="M168,196 H188 V148 H220" marker-end="url(#d-arr)"/>
    <path d="M168,224 H188 V268 H220" marker-end="url(#d-arr)"/>
    <path d="M392,148 H420 V180 H452" marker-end="url(#d-arr)"/>
    <path d="M392,268 H420 V232 H452" marker-end="url(#d-arr)"/>
    <path d="M672,208 H700 V138 H732" marker-end="url(#d-arr)"/>
    <path d="M896,150 H920 V192 H948" marker-end="url(#d-arr)"/>
    <path d="M672,328 H704 V392 Q704,400 712,400 H924 Q932,400 932,392 V340 Q932,332 940,332 H948" marker-end="url(#d-arr)"/>
    <path d="M1040,260 V300" marker-end="url(#d-arr-acc)"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" fill="#7a8399">
    <text x="32" y="416">ŠTÝL: žiadne tiene · hairline rámce · grid 4 px · accent max 2 prvky - podľa diagram-design style-guide.md</text>
  </g>
</svg>
