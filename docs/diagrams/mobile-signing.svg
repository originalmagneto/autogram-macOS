<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="704" viewBox="0 0 1160 704" role="img" aria-labelledby="mobile-signing-title mobile-signing-desc">
  <title id="mobile-signing-title">Podpis mobilom cez Autogram v mobile</title>
  <desc id="mobile-signing-desc">Sekvencia podpisu bez čítačky: Autogram macOS nahrá zašifrovaný dokument na AVM server, ukáže QR kód, iPhone s aplikáciou Autogram v mobile podpíše dokument občianskym preukazom cez NFC a Mac si podpísaný súbor stiahne pollingom.</desc>
  <defs>
    <marker id="ms-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="ms-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="ms-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
    <marker id="ms-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="1160" height="704" fill="#f5f5f5"/>

  <!-- ======================= HEADER ======================= -->
  <text x="32" y="28" fill="#2d3142" font-size="20" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Podpis mobilom - občiansky preukaz s NFC cez iPhone</text>
  <text x="32" y="44" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="1.1">AVM RELAY · KĽÚČ POZNÁ LEN MAC · SERVER DOKUMENT ZMAŽE DO 24 H</text>

  <!-- ======================= LIFELINES ======================= -->
  <line x1="160" y1="112" x2="160" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="440" y1="112" x2="440" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="720" y1="112" x2="720" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="1000" y1="112" x2="1000" y2="636" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ======================= LOOP FRAGMENT (before arrows) ======================= -->
  <rect x="136" y="424" width="328" height="104" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <rect x="136" y="424" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <text x="156" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="1">LOOP</text>
  <text x="188" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.3">[každú 1 s, najviac 15 min]</text>

  <!-- ======================= ACTIVATION BARS ======================= -->
  <rect x="156" y="136" width="8" height="480" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="436" y="136" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="716" y="192" width="8" height="216" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="436" y="248" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="996" y="320" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <rect x="436" y="392" width="8" height="176" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

  <!-- ======================= MESSAGES (time flows down) ======================= -->
  <!-- 1. Mac -> AVM: upload -->
  <line x1="164" y1="144" x2="436" y2="144" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ms-arrow-link)"/>
  <!-- 2. AVM -> Mac: guid (return) -->
  <line x1="436" y1="176" x2="164" y2="176" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arrow)"/>
  <!-- 3. Mac -> iPhone: QR code scanned by camera (async) -->
  <line x1="164" y1="216" x2="716" y2="216" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arrow-open)"/>
  <!-- 4. iPhone -> AVM: visualization + datatosign -->
  <line x1="716" y1="256" x2="444" y2="256" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ms-arrow-link)"/>
  <!-- 5. AVM -> iPhone: dataToSign (return) -->
  <line x1="444" y1="288" x2="716" y2="288" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arrow)"/>
  <!-- 6. iPhone -> eID: NFC signing -->
  <line x1="724" y1="328" x2="996" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ms-arrow)"/>
  <!-- 7. eID -> iPhone: signed data (return) -->
  <line x1="996" y1="360" x2="724" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arrow)"/>
  <!-- 8. iPhone -> AVM: POST sign -->
  <line x1="716" y1="400" x2="444" y2="400" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ms-arrow-link)"/>
  <!-- 9. Mac -> AVM: poll -->
  <line x1="164" y1="472" x2="436" y2="472" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ms-arrow-link)"/>
  <!-- 10. AVM -> Mac: 304 (return) -->
  <line x1="436" y1="504" x2="164" y2="504" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arrow)"/>
  <!-- 11. AVM -> Mac: signed document (headline) -->
  <line x1="436" y1="560" x2="164" y2="560" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ms-arrow-accent)"/>
  <!-- 12. Mac self: save, validate, register -->
  <path d="M164 592 H188 a8 8 0 0 1 8 8 V608 a8 8 0 0 1 -8 8 H168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ms-arrow)"/>

  <!-- ======================= MESSAGE LABELS (masks 6-10px above strokes) ======================= -->
  <rect x="216" y="124" width="168" height="12" rx="2" fill="#f5f5f5"/>
  <text x="300" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">POST /DOCUMENTS · AES KĽÚČ</text>

  <rect x="232" y="156" width="136" height="12" rx="2" fill="#f5f5f5"/>
  <text x="300" y="165" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">GUID · LAST-MODIFIED</text>

  <rect x="516" y="196" width="168" height="12" rx="2" fill="#f5f5f5"/>
  <text x="600" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">QR KÓD · GUID + KĽÚČ</text>

  <rect x="484" y="236" width="192" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">VISUALIZATION · DATATOSIGN</text>

  <rect x="532" y="268" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">DATA TO SIGN</text>

  <rect x="796" y="308" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="860" y="317" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">NFC · PIN A BOK</text>

  <rect x="800" y="340" width="120" height="12" rx="2" fill="#f5f5f5"/>
  <text x="860" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">PODPÍSANÉ DÁTA</text>

  <rect x="508" y="380" width="144" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">POST SIGN · SIGNEDDATA</text>

  <rect x="196" y="452" width="208" height="12" rx="2" fill="#f5f5f5"/>
  <text x="300" y="461" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">GET /DOCUMENTS · IF-MODIFIED-SINCE</text>

  <rect x="232" y="484" width="136" height="12" rx="2" fill="#f5f5f5"/>
  <text x="300" y="493" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">304 · EŠTE NEPODPÍSANÉ</text>

  <rect x="208" y="540" width="184" height="12" rx="2" fill="#f5f5f5"/>
  <text x="300" y="549" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.5">200 · PODPÍSANÝ DOKUMENT</text>

  <rect x="204" y="596" width="196" height="12" rx="2" fill="#f5f5f5"/>
  <text x="208" y="605" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.5">ULOŽENIE · VALIDÁCIA · EVIDENCIA</text>

  <!-- ======================= ACTORS (drawn last) ======================= -->
  <!-- Autogram macOS (focal) -->
  <rect x="60" y="64" width="200" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="60" y="64" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="160" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Autogram macOS</text>
  <text x="160" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">AVMClient · AVMSigningSession</text>

  <!-- AVM server (external) -->
  <rect x="340" y="64" width="200" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="340" y="64" width="200" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="440" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">AVM server</text>
  <text x="440" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">autogram.slovensko.digital</text>

  <!-- iPhone (external) -->
  <rect x="620" y="64" width="200" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="620" y="64" width="200" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="720" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">iPhone</text>
  <text x="720" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">Autogram v mobile</text>

  <!-- eID (input / user) -->
  <rect x="900" y="64" width="200" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="900" y="64" width="200" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="1000" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Občiansky preukaz</text>
  <text x="1000" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">NFC · kvalifikovaný certifikát</text>

  <!-- ======================= LEGEND ======================= -->
  <line x1="32" y1="656" x2="1128" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="1.4">LEGENDA</text>

  <line x1="120" y1="672" x2="152" y2="672" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ms-arrow-link)"/>
  <text x="160" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">HTTPS volanie</text>

  <line x1="280" y1="672" x2="312" y2="672" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arrow)"/>
  <text x="320" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">odpoveď</text>

  <line x1="408" y1="672" x2="440" y2="672" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ms-arrow-open)"/>
  <text x="448" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">QR kód naskenovaný fotoaparátom</text>

  <line x1="680" y1="672" x2="712" y2="672" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ms-arrow-accent)"/>
  <text x="720" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">podpísaný dokument späť v Macu</text>

  <rect x="944" y="664" width="8" height="12" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="960" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">aktívny účastník</text>
</svg>
